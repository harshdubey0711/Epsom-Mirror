<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Epsom Cryo Spa Mumbai</title>
  <meta name="description" content="Contact Epsom Cryo Spa. Call, email, or send a message to book your wellness consultation in Mumbai.">
  <link rel="canonical" href="https://www.epsomcryospa.com/contact.html">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Tenor+Sans&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="./assets/css/main.css" rel="stylesheet">
</head>
<body data-page-context="Contact">
  <div id="site-header-slot"></div>
  <main class="pt-24 pb-24 px-4">
    <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12">
      <div data-aos="fade-right">
        <h1 class="font-display text-4xl text-epsom-ink">Contact Us</h1>
        <p class="text-epsom-muted mt-4">Fill out the form or reach us directly. We'll respond within 24 hours.</p>
        <div class="mt-10 space-y-6">
          <div>
            <h3 class="text-epsom-ink font-medium">Phone</h3>
            <p class="text-epsom-muted mt-1"><a href="tel:+919867670764" class="hover:text-epsom-maroon">+91 9867670764</a></p>
            <p class="text-epsom-muted"><a href="tel:+919867670762" class="hover:text-epsom-maroon">+91 9867670762</a></p>
          </div>
          <div>
            <h3 class="text-epsom-ink font-medium">Email</h3>
            <a href="mailto:info@epsomcryospa.com" class="text-epsom-maroon hover:underline">info@epsomcryospa.com</a>
          </div>
          <div>
            <h3 class="text-epsom-ink font-medium">Flagship Address</h3>
            <p class="text-epsom-muted text-sm mt-1">Kamla Spaces, Shop no.6, S.V Road, Santacruz (West), Mumbai 400054</p>
          </div>
          <button type="button" data-book-trigger class="btn-primary">Book Online</button>
        </div>
      </div>
      <form id="contact-form" class="glass-card p-8 space-y-5" data-aos="fade-left">
        <div>
          <label class="block text-sm text-epsom-muted mb-1">Full Name</label>
          <input type="text" name="name" required class="w-full bg-epsom-mist border border-epsom-crystal/40 rounded-lg px-4 py-3 text-epsom-ink focus:border-epsom-maroon outline-none">
        </div>
        <div>
          <label class="block text-sm text-epsom-muted mb-1">Email Address</label>
          <input type="email" name="email" required class="w-full bg-epsom-mist border border-epsom-crystal/40 rounded-lg px-4 py-3 text-epsom-ink focus:border-epsom-maroon outline-none">
        </div>
        <div>
          <label class="block text-sm text-epsom-muted mb-1">Phone Number</label>
          <input type="tel" name="phone" required class="w-full bg-epsom-mist border border-epsom-crystal/40 rounded-lg px-4 py-3 text-epsom-ink focus:border-epsom-maroon outline-none">
        </div>
        <div>
          <label class="block text-sm text-epsom-muted mb-1">Your Message</label>
          <textarea name="message" rows="5" required class="w-full bg-epsom-mist border border-epsom-crystal/40 rounded-lg px-4 py-3 text-epsom-ink focus:border-epsom-maroon outline-none resize-none"></textarea>
        </div>
        <button type="submit" class="btn-primary w-full">Send Message</button>
        <p id="form-status" class="hidden text-sm text-epsom-maroon text-center"></p>
      </form>
    </div>
  </main>
  <div id="site-footer-slot"></div>
  <div id="booking-modal-slot"></div>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script type="module" src="./assets/js/layout.js"></script>
</body>
</html>
